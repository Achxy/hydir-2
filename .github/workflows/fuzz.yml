name: fuzz corpus and smoke
on:
  push:
  pull_request:
jobs:
  native-linux-fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust and cargo-fuzz
        run: |
          # Build the pinned cargo-fuzz with the repository toolchain, then use
          # nightly explicitly for libFuzzer because rust-toolchain.toml pins stable.
          rustup toolchain install nightly
          cargo install cargo-fuzz --version 0.12.0 --locked
      - name: ELF import and region corpus
        run: |
          cargo +nightly fuzz build elf_import
          cargo +nightly fuzz run elf_import -- -max_total_time=30 2>&1 | tee fuzz/fuzz-elf_import.log
      - name: Scalar CFG and lift corpus
        run: |
          cargo +nightly fuzz build cfg_lift
          cargo +nightly fuzz run cfg_lift -- -max_total_time=30 2>&1 | tee fuzz/fuzz-cfg_lift.log
      - name: LLVM-to-C parser corpus
        run: |
          cargo +nightly fuzz build c_output
          cargo +nightly fuzz run c_output -- -max_total_time=30 2>&1 | tee fuzz/fuzz-c_output.log
      - name: HydIR specification parser corpus
        run: |
          cargo +nightly fuzz build hydir_spec
          cargo +nightly fuzz run hydir_spec -- -max_total_time=30 2>&1 | tee fuzz/fuzz-hydir_spec.log
      - name: Report bounded fuzz crash evidence
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(fuzz/artifacts/*/*)
          if (( ${#artifacts[@]} == 0 )); then
            echo "::warning::Fuzzing failed without producing a crash artifact"
          fi
          for artifact in "${artifacts[@]}"; do
            size=$(stat -c '%s' "$artifact")
            digest=$(sha256sum "$artifact" | cut -d' ' -f1)
            prefix=$(head -c 4096 "$artifact" | base64 -w 0)
            echo "::error file=$artifact,title=Fuzz crash input::size=$size sha256=$digest base64_prefix=$prefix"
          done
          logs=(fuzz/fuzz-*.log)
          for log in "${logs[@]}"; do
            tail=$(tail -c 8192 "$log" | base64 -w 0)
            echo "::error file=.github/workflows/fuzz.yml,title=Fuzz output tail::$log base64_tail=$tail"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
