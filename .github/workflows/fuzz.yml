name: fuzz corpus and smoke
on:
  push:
  pull_request:
jobs:
  fuzz-feature:
    name: Fuzz / ${{ matrix.feature }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature: elf-import
            target: elf_import
          - feature: cfg-lifting
            target: cfg_lift
          - feature: c-output
            target: c_output
          - feature: spec-parser
            target: hydir_spec
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust and cargo-fuzz
        run: |
          # Build the pinned cargo-fuzz with the repository toolchain, then use
          # nightly explicitly for libFuzzer because rust-toolchain.toml pins stable.
          rustup toolchain install nightly
          cargo install cargo-fuzz --version 0.12.0 --locked
      - name: Build and run feature corpus
        env:
          ASAN_OPTIONS: detect_leaks=0
          LSAN_OPTIONS: detect_leaks=0
        run: |
          set -o pipefail
          cargo +nightly fuzz build ${{ matrix.target }}
          # The Rust/libFuzzer runtime leaks at process exit on empty input;
          # keep the other sanitizer checks enabled.
          cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=30 -detect_leaks=0 2>&1 | tee fuzz/fuzz-${{ matrix.target }}.log
      - name: Report bounded fuzz crash evidence
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(fuzz/artifacts/${{ matrix.target }}/*)
          if (( ${#artifacts[@]} == 0 )); then
            echo "::warning::Fuzzing failed without producing a crash artifact"
          fi
          for artifact in "${artifacts[@]}"; do
            size=$(stat -c '%s' "$artifact")
            digest=$(sha256sum "$artifact" | cut -d' ' -f1)
            prefix=$(head -c 4096 "$artifact" | base64 -w 0)
            echo "::error file=$artifact,title=Fuzz crash input::size=$size sha256=$digest base64_prefix=$prefix"
          done
          logs=(fuzz/fuzz-${{ matrix.target }}.log)
          for log in "${logs[@]}"; do
            tail=$(tail -c 8192 "$log" | base64 -w 0)
            echo "::error file=.github/workflows/fuzz.yml,title=Fuzz output tail::$log base64_tail=$tail"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          if-no-files-found: ignore
          path: |
            fuzz/artifacts/${{ matrix.target }}/
            fuzz/fuzz-${{ matrix.target }}.log
