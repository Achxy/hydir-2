name: fuzz corpus and smoke
on:
  push:
  pull_request:
jobs:
  native-linux-fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust and cargo-fuzz
        run: |
          # Build the pinned cargo-fuzz with the repository toolchain, then use
          # nightly explicitly for libFuzzer because rust-toolchain.toml pins stable.
          rustup toolchain install nightly
          cargo install cargo-fuzz --version 0.12.0 --locked
      - name: ELF import and region corpus
        run: |
          cargo +nightly fuzz build elf_import
          cargo +nightly fuzz run elf_import -- -max_total_time=30
      - name: Scalar CFG and lift corpus
        run: |
          cargo +nightly fuzz build cfg_lift
          cargo +nightly fuzz run cfg_lift -- -max_total_time=30
      - name: LLVM-to-C parser corpus
        run: |
          cargo +nightly fuzz build c_output
          cargo +nightly fuzz run c_output -- -max_total_time=30
      - name: HydIR specification parser corpus
        run: |
          cargo +nightly fuzz build hydir_spec
          cargo +nightly fuzz run hydir_spec -- -max_total_time=30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
