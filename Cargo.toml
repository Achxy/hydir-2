[workspace]
members = ["crates/hydir-core", "crates/hydir-backend", "crates/hydir-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
object = { version = "0.39.1", features = ["read"] }
iced-x86 = "1.21.0"
