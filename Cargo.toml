[workspace]
members = ["crates/hydir-core", "crates/hydir-semantics", "crates/hydir-project", "crates/hydir-backend", "crates/hydir-analysis", "crates/hydir-c", "crates/hydir-patch", "crates/hydir-transform", "crates/hydir-recompile", "crates/hydir-cli", "crates/hydir-api", "crates/hydir-interchange", "crates/hydir-server", "crates/hydir-gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
object = { version = "0.39.1", features = ["read"] }
iced-x86 = "1.21.0"
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
tonic-health = "=0.14.6"
prost = "0.14"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
libc = "0.2"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
uuid = { version = "=1.26.1", features = ["v4"] }
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_graph = "=0.16.3"
egui_graph_egui = { package = "egui", version = "=0.34.3", default-features = false }
