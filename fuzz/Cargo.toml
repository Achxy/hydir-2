[package]
name = "hydir-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
hydir-backend = { path = "../crates/hydir-backend" }
hydir-c = { path = "../crates/hydir-c" }
hydir-interchange = { path = "../crates/hydir-interchange" }
hydir-core = { path = "../crates/hydir-core" }
hydir-decompile = { path = "../crates/hydir-decompile" }
hydir-ir = { path = "../crates/hydir-ir" }
serde_json = "1.0"

[[bin]]
name = "elf_import"
path = "fuzz_targets/elf_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cfg_lift"
path = "fuzz_targets/cfg_lift.rs"
test = false
doc = false
bench = false

[[bin]]
name = "c_output"
path = "fuzz_targets/c_output.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hydir_spec"
path = "fuzz_targets/hydir_spec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "native_pipeline"
path = "fuzz_targets/native_pipeline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "native_ir_json"
path = "fuzz_targets/native_ir_json.rs"
test = false
doc = false
bench = false
