syntax = "proto3";
package hydir.v3;

// Native whole-program and caller-supplied Ghidra snapshot analysis contract.
// v1 and v2 remain available for compatibility. Snapshot analysis consumes
// Ghidra export evidence; this RPC does not launch Ghidra headlessly.
service HydirV3 {
  rpc Discover (DiscoverRequest) returns (DiscoverReply);
  rpc StartProgramAnalysis (StartProgramAnalysisRequest) returns (JobReply);
  rpc GetAnalysisJob (JobRequest) returns (JobReply);
  rpc CancelAnalysisJob (JobRequest) returns (JobReply);
  rpc StreamAnalysisEvents (JobEventRequest) returns (stream JobEvent);
  rpc GetProgramArtifact (ProgramArtifactRequest) returns (ArtifactReply);
  rpc AnalyzeGhidraSnapshot (GhidraSnapshotArtifactRequest) returns (ArtifactReply);
  rpc UpdateAnalystFact (AnalystFactRequest) returns (MutationReply);
}

message DiscoverRequest {}
message DiscoverReply {
  uint32 api_version = 1;
  uint32 program_spec_version = 2;
  uint32 function_index_version = 3;
  uint32 machine_ir_version = 4;
  uint32 state_ir_version = 5;
  uint32 function_ir_version = 6;
  uint32 cir_version = 7;
  uint32 decompilation_unit_version = 8;
  string stable_contract = 9;
  bool isolated_analysis_jobs = 10;
  bool analyst_fact_updates = 11;
  bool ghidra_snapshot_analysis = 12;
}

message StartProgramAnalysisRequest {
  string project_id = 1;
  uint64 expected_revision = 2;
  string idempotency_key = 3;
}

message JobRequest {
  string project_id = 1;
  string job_id = 2;
}

message JobReply {
  string project_id = 1;
  string job_id = 2;
  uint64 project_revision = 3;
  string kind = 4;
  string state = 5;
  string artifact_sha256 = 6;
  string diagnostic = 7;
}

message JobEventRequest {
  string project_id = 1;
  string job_id = 2;
  uint64 after_sequence = 3;
}

message JobEvent {
  uint64 sequence = 1;
  string job_id = 2;
  string state = 3;
  string message = 4;
  string artifact_sha256 = 5;
}

// stage is one of program_spec, function_index, coverage, machine, state,
// function, cir, llvm, unit, analysis_model, high_level_cir, or typed_c.
// Function-scoped stages require a FunctionIndex
// id or an unambiguous discovered name in function_selector.
message ProgramArtifactRequest {
  string project_id = 1;
  uint64 expected_revision = 2;
  string stage = 3;
  string function_selector = 4;
}

message ArtifactReply {
  string sha256 = 1;
  string media_type = 2;
  bytes content = 3;
  uint64 project_revision = 4;
}

// The caller supplies an exporter snapshot for the current project binary.
// stage is pcode, semantics, state, cfg, coverage, llvm-cfg, or slice. Only
// llvm-cfg accepts start_address, a 0x-prefixed address in the selected function
// space. Only slice accepts the operation selector. Both indices are required
// for slice; input_index is optional and restricts the slice to one input.
// The server validates the snapshot digest against the uploaded binary and
// runs the bounded Rust analysis in its isolated worker process.
message GhidraSnapshotArtifactRequest {
  string project_id = 1;
  uint64 expected_revision = 2;
  bytes snapshot_json = 3;
  string stage = 4;
  string start_address = 5;
  optional uint32 instruction_index = 6;
  optional uint32 operation_index = 7;
  optional uint32 input_index = 8;
}

// Facts are revision-checked project mutations and retain analyst provenance.
message AnalystFactRequest {
  string project_id = 1;
  uint64 expected_revision = 2;
  string idempotency_key = 3;
  string kind = 4;
  string address = 5;
  string value = 6;
  string scope = 7;
}

message MutationReply {
  string project_id = 1;
  uint64 revision = 2;
  string binary_sha256 = 3;
}
