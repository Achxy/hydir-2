syntax = "proto3";
package hydir.v2;

service HydirV2 {
  rpc Discover (DiscoverRequest) returns (DiscoverReply);
  rpc GetRegion (RegionRequest) returns (ArtifactReply);
  rpc DecompileRegion (RegionRequest) returns (ArtifactReply);
  rpc CompilePatch (PatchRequest) returns (ArtifactReply);
  rpc ApplyPatch (PatchRequest) returns (MutationReply);
  rpc VerifyPatch (VerifyPatchRequest) returns (VerificationReply);
}

message DiscoverRequest {}
message DiscoverReply {
  uint32 api_version = 1;
  uint32 program_spec_version = 2;
  uint32 region_spec_version = 3;
  uint32 decompilation_unit_version = 4;
  uint32 patch_bundle_version = 5;
  string stable_contract = 6;
  bool compile_patch = 7;
  bool structural_patch_verification = 8;
  bool behavior_patch_verification = 9;
}

message RegionRequest {
  string project_id = 1;
  uint64 expected_revision = 2;
  string function_symbol = 3;
  bool assume_u64x2 = 4;
}

message PatchRequest {
  string project_id = 1;
  uint64 expected_revision = 2;
  string idempotency_key = 3;
  bytes patch_json = 4;
  bool trusted_fixture = 5;
  bool assume_u64x2 = 6;
  bool assume_entry_only = 7;
}

message VerifyPatchRequest {
  string project_id = 1;
  uint64 expected_revision = 2;
  bytes patch_bundle_json = 3;
}

message ArtifactReply {
  string sha256 = 1;
  string media_type = 2;
  bytes content = 3;
  uint64 project_revision = 4;
}

message MutationReply {
  string project_id = 1;
  uint64 revision = 2;
  string binary_sha256 = 3;
  string patch_bundle_sha256 = 4;
}

message VerificationReply {
  bool structurally_valid = 1;
  bool behavior_verified = 2;
  string report_json = 3;
}
